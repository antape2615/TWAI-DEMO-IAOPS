services:
  postgres:
    image: postgres:15-alpine
    container_name: iaops-postgres
    environment:
      POSTGRES_USER: iaops
      POSTGRES_PASSWORD: iaops
      POSTGRES_DB: iaops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iaops" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iaops-network

  redis:
    image: redis:7-alpine
    container_name: iaops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iaops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iaops-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://iaops:iaops@postgres:5432/iaops
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - APP_NAME=IAOPS Platform
      - SECRET_KEY=iaops-secret-key-change-in-production-12345678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - iaops-network

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: iaops-docs
    ports:
      - "8002:8000"
    volumes:
      - ./:/docs
    command: serve --dev-addr=0.0.0.0:8000
    networks:
      - iaops-network

  mcp:
    build:
      context: ./backend/mcp/mcp-client-demo/clients/simple-chatbot
      dockerfile: Dockerfile
    container_name: iaops-mcp
    ports:
      - "8001:8001"
    env_file:
      - ./backend/mcp/mcp-client-demo/clients/simple-chatbot/.env.mcp
    environment:
      - MCP_API_PORT=8001
    networks:
      - iaops-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: iaops-grafana
    env_file:
      - backend/.env.docker
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
    networks:
      - iaops-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:


networks:
  iaops-network:
    driver: bridge
