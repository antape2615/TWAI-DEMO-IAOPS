version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iaops-postgres
    environment:
      POSTGRES_USER: iaops
      POSTGRES_PASSWORD: iaops
      POSTGRES_DB: iaops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iaops-network

  redis:
    image: redis:7-alpine
    container_name: iaops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iaops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iaops-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://iaops:iaops@postgres:5432/iaops
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - APP_NAME=IAOPS Platform
      - SECRET_KEY=iaops-secret-key-change-in-production-12345678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - iaops-network

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: iaops-docs
    ports:
      - "8001:8000"
    volumes:
      - ./:/docs
    command: serve --dev-addr=0.0.0.0:8000
    networks:
      - iaops-network

volumes:
  postgres_data:
  redis_data:

networks:
  iaops-network:
    driver: bridge
